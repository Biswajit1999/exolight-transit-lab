<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExoIntel-Prime | ExoLight Transit Lab</title>
  <meta name="description" content="ExoIntel-Prime is an interactive exoplanet transit photometry laboratory with archival light curves, worker-backed theoretical modelling, finite-exposure integration, eccentric orbit geometry, and cinematic visualisation." />
  <meta name="keywords" content="exoplanet, transit photometry, light curve, WebGL, TESS, Kepler, K2, MAST, NASA Exoplanet Archive, astrophysics, exomoon, starspot, limb darkening, transit modelling" />
  <meta name="author" content="Biswajit Jana" />
  <meta name="theme-color" content="#060b13" />
  <meta name="color-scheme" content="dark light" />
  <meta property="og:title" content="ExoIntel-Prime | Exoplanet Transit Photometry Lab" />
  <meta property="og:description" content="A browser-based exoplanet transit laboratory comparing archival photometry with worker-computed theoretical models." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ExoIntel-Prime" />
  <link rel="stylesheet" href="./styles.css?v=20260517-recovery-03" />
</head>
<body>
  <noscript>
    <strong>JavaScript is required.</strong><br />
    ExoIntel-Prime uses browser JavaScript, ES modules, Canvas/WebGL-capable rendering, and a Web Worker to calculate and display exoplanet transit models.
  </noscript>

  <main id="app" aria-label="ExoIntel-Prime exoplanet transit photometry laboratory">
    <section class="boot-screen" aria-label="Loading ExoIntel-Prime">
      <div class="boot-card">
        <div class="boot-logo" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <defs>
              <radialGradient id="bootStar" cx="45%" cy="42%" r="64%">
                <stop offset="0%" stop-color="#ffe0a3" />
                <stop offset="42%" stop-color="#ffb547" />
                <stop offset="72%" stop-color="#d86f16" />
                <stop offset="100%" stop-color="#5b2508" />
              </radialGradient>
              <linearGradient id="bootOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#63a7ff" />
                <stop offset="100%" stop-color="#50c6df" />
              </linearGradient>
              <filter id="bootGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <rect x="7" y="7" width="106" height="106" rx="30" fill="rgba(12,20,35,.96)" stroke="rgba(99,167,255,.38)" stroke-width="2" />
            <circle cx="62" cy="62" r="29" fill="url(#bootStar)" filter="url(#bootGlow)" />
            <path d="M22 77 C40 30, 85 24, 101 47" fill="none" stroke="url(#bootOrbit)" stroke-width="4" stroke-linecap="round" opacity=".95" />
            <circle cx="49" cy="61" r="9.2" fill="#06111f" stroke="#50c6df" stroke-width="1.8" />
            <circle cx="86" cy="34" r="2.8" fill="#ffb547" />
            <circle cx="30" cy="88" r="2.3" fill="#63a7ff" />
          </svg>
        </div>
        <div class="boot-copy">
          <p class="boot-eyebrow">ExoLight Transit Lab</p>
          <h1>ExoIntel-Prime</h1>
          <p class="boot-description">
            Preparing the transit laboratory, loading archival photometry, and building the theoretical star–planet system.
          </p>
          <div class="boot-status-wrap" aria-live="polite">
            <p id="boot-status" class="boot-status">Initialising observatory systems...</p>
            <div class="boot-percent-row">
              <span class="boot-percent-label">Progress</span>
              <span id="boot-percent" class="boot-percent-value">0%</span>
            </div>
          </div>
          <div class="boot-metrics" aria-hidden="true">
            <span>Quadratic limb darkening</span>
            <span>Finite exposure model</span>
            <span>Eccentric geometry</span>
          </div>
          <div class="boot-progress" aria-hidden="true">
            <span id="boot-progress-bar"></span>
          </div>
          <small>Author: Biswajit Jana ©2026</small>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./src/app.js?v=20260517-recovery-03"></script>
</body>
</html>
