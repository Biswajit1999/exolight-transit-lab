<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ExoIntel-Prime | ExoLight Transit Lab</title>

  <meta
    name="description"
    content="ExoIntel-Prime is a browser-based exoplanet transit photometry laboratory with archival light curves, worker-backed theoretical modelling, and WebGL scientific visualisation."
  />

  <meta
    name="keywords"
    content="exoplanet, transit photometry, light curve, WebGL, TESS, Kepler, K2, MAST, NASA Exoplanet Archive, astrophysics"
  />

  <meta
    name="author"
    content="Biswajit Jana"
  />

  <meta
    name="theme-color"
    content="#060b13"
  />

  <meta
    property="og:title"
    content="ExoIntel-Prime | Exoplanet Transit Photometry Lab"
  />

  <meta
    property="og:description"
    content="A browser-based exoplanet transit laboratory comparing archival photometry with worker-computed theoretical models."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:site_name"
    content="ExoIntel-Prime"
  />

  <link
    rel="stylesheet"
    href="./styles.css"
  />
</head>

<body>
  <noscript>
    <strong>JavaScript is required.</strong>
    <br />
    ExoIntel-Prime uses browser JavaScript, ES modules, WebGL, and a Web Worker
    to calculate and display exoplanet transit models. Please enable JavaScript
    to use the interactive photometry laboratory.
  </noscript>

  <main
    id="app"
    aria-label="ExoIntel-Prime exoplanet transit photometry laboratory"
  >
    <section class="boot-screen">
      <div class="boot-card">
        <div class="boot-mark" aria-hidden="true"></div>

        <h1>ExoIntel-Prime</h1>

        <p>
          Loading worker-backed exoplanet transit photometry laboratory...
        </p>

        <small>
          SYSTEM OPERATOR: BISWAJIT JANA // © 2026
        </small>
      </div>
    </section>
  </main>

  <script
    type="module"
    src="./src/app.js"
  ></script>
</body>
</html>
